name: metis_orbital_viewer
description: Flutter mission viewer for authoritative Metis simulation telemetry.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  pointer_interceptor: ^0.10.1+2
  http: ^1.5.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  fl_chart: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/metis-orbital-logo.png
    - assets/images/metis-orbital-mark.png
    - assets/images/wildfire-camp-fire-landsat8.jpg
  fonts:
    - family: MetisSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
