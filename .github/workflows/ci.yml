name: Simulation gates
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simulation-gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: metis
          POSTGRES_PASSWORD: metis-ci-only
          POSTGRES_DB: metis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metis -d metis_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: uv sync --frozen
      - run: npm ci --prefix frontend
      - run: uv run ruff check backend/src backend/migrations tests scripts examples
      - run: uv run ruff format --check backend/src backend/migrations tests scripts examples
      - run: uv run mypy backend/src scripts/generate_contracts.py
      - run: uv run metis-sim migrate
        env:
          METIS_DATABASE_URL: postgresql+psycopg://metis:metis-ci-only@127.0.0.1:5432/metis_test
      - run: uv run pytest -q
        env:
          METIS_TEST_DATABASE_URL: postgresql+psycopg://metis:metis-ci-only@127.0.0.1:5432/metis_test
      - run: uv run python scripts/generate_contracts.py
      - run: git diff --exit-code -- schemas frontend/lib/api/generated.dart frontend/lib/api/shift_log_generated.dart frontend/lib/api/cases_generated.dart
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run prepare:cesium
      - run: flutter pub get --enforce-lockfile
        working-directory: frontend
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: frontend
      - run: uv run zensical build --clean --strict
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build --pull --tag metis-simulation:ci .
