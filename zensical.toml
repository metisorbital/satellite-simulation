[project]
site_url = "https://metisorbital.github.io/satellite-simulation/"
site_name = "Metis Simulation"
# site_description = "Your project description"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

# repo_url = "https://github.com/user/repo"
# repo_name = "user/repo"
# edit_uri = "edit/main/docs/"

watch = ["backend/src/metis_sim/adapters/tables.py"]

nav = [
  { "Overview" = "index.md" },
  { "Run a Local Demo" = "getting-started.md" },
  { "Database Tables" = "reference/database.md" },
  { "Consume the API" = "api.md" },
  { "Satellite Telemetry" = [
    { "Models and ML Export" = "reference/spacecraft-telemetry.md" },
    { "Sample Field Reference" = "reference/sample-telemetry.md" },
    { "Validation and Limits" = "validation/spacecraft-telemetry.md" },
  ] },
  { "Flutter Viewer" = "frontend.md" },
  { "Python API Reference" = [
    { "Object Guide" = "python-api.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Public Data" = "reference/public-data.md" },
    { "Physics" = "reference/physics.md" },
    { "Application Services" = "reference/application.md" },
    { "Persistence" = "reference/persistence.md" },
    { "HTTP and Runtime" = "reference/runtime.md" },
  ] },
  { "Make a Change" = "contributing.md" },
  { "Implementation" = "implementation.md" },
  { "Specification" = "specification.md" },
  { "Physics Model" = "physics-model.md" },
  { "Contracts" = "contracts.md" },
  { "Validation" = "validation/README.md" },
  { "Research" = "research/README.md" },
]

